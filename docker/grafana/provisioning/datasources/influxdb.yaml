apiVersion: 1
datasources:
  - name: InfluxDB
    uid: pcnme-influx
    type: influxdb
    access: proxy
    url: http://10.40.0.3:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: $INFLUX_ORG
      defaultBucket: $INFLUX_BUCKET
    secureJsonData:
      token: $INFLUX_TOKEN
