name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"   # Greek letters in output; Windows consoles default to cp1252

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # the desktop runs Windows; multiprocessing must work with spawn
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests (fast)
        run: pytest -q -n auto --cov --cov-report=term-missing:skip-covered
      - name: Config arithmetic
        run: python tools/calc_defaults.py

  slow:
    name: statistical tests (slow)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Slow tests (exit code 5 = none collected yet, allowed until M1)
        shell: bash
        run: |
          set +e
          pytest -q -m slow -n auto
          rc=$?
          if [ $rc -eq 5 ]; then exit 0; fi
          exit $rc
