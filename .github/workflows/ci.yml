name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"   # Greek letters in output; Windows consoles default to cp1252

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]   # the desktop runs Windows; multiprocessing must work with spawn
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (exactly uv.lock; fails if the lock is out of date, PLAN M0.4)
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src tests tools && uv run --no-sync ruff format --check src tests tools
      - name: Types
        run: uv run --no-sync mypy
      - name: Tests (fast)
        run: uv run --no-sync pytest -q -n auto --cov --cov-report=term-missing:skip-covered
      - name: Config arithmetic
        run: uv run --no-sync python tools/calc_defaults.py

  slow:
    name: statistical tests (slow)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: Slow tests (exit code 5 = none collected yet, allowed until M1)
        shell: bash
        run: |
          set +e
          uv run --no-sync pytest -q -m slow -n auto
          rc=$?
          if [ $rc -eq 5 ]; then exit 0; fi
          exit $rc
