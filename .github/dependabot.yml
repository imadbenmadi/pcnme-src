# Dependabot (CLAUDE.md: uv.lock pins every version; a dependency change is its own PR).
# reference/ holds the VFC paper's code, read-only and never installed: no updates there.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    exclude-paths:
      - "reference/**"
  - package-ecosystem: "pip"
    directory: "/reference/vfc"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0  # read-only reference code: never open update PRs here
