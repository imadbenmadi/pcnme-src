[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcnme"
version = "0.1.0"
description = "PCNME: predictive task offloading for connected cars across fog zones and the cloud (MSc thesis, ELTE)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.11",          # Erlang C / Student t in tests and statistics
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3.5",    # parallel test runs (-n auto)
  "hypothesis>=6.100",    # property tests (e.g. drop reward < every delivery, N18)
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
]
ml = [
  "torch>=2.3",           # on the desktop install the CUDA wheel, see README
  "pymoo>=0.6.1",
]
analysis = [
  "pandas>=2.1",
  "pyarrow>=14",          # Parquet result files
  "matplotlib>=3.8",
]
testbed = [
  "paho-mqtt>=2.0",       # MQTT client (EMQX broker)
  "fastapi>=0.110",       # zone and cloud HTTP API
  "uvicorn>=0.29",
  "httpx>=0.27",          # HTTP client between containers
  "websockets>=12",       # serving zone <-> car results
  "influxdb-client>=1.40",
  "minio>=7.2",
]
maps = [
  "eclipse-sumo>=1.20",   # SUMO tools to export LuST FCD traces (final-design 16.2)
]
all = ["pcnme[dev,ml,analysis,testbed,maps]"]

[project.scripts]
pcnme = "pcnme.experiments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not testbed and not gpu'"
markers = [
  "slow: long statistical tests (M/M/1, M/M/c with 200 000 tasks); run with -m slow",
  "testbed: needs Docker and the running testbed; run with -m testbed",
  "gpu: needs a CUDA GPU (calibration); run with -m gpu",
]
filterwarnings = ["error::DeprecationWarning:pcnme.*"]

[tool.coverage.run]
source = ["pcnme"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]   # Greek letters and math symbols are used on purpose (ρ, λ, Ê)

[tool.mypy]
python_version = "3.12"
files = ["src/pcnme"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
